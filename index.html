<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新日本ウエックス様 SharePoint移管 設計デモ（v2.2 レベルサイト構成）</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI","Yu Gothic UI","Meiryo",sans-serif; }
  body { background:#f5f6f8; color:#242424; font-size:14px; }
  /* ===== M365 スイートバー ===== */
  .suitebar { background:#0b3d91; color:#fff; height:48px; display:flex; align-items:center; padding:0 16px; gap:14px; position:sticky; top:0; z-index:50; }
  .waffle { display:grid; grid-template-columns:repeat(3,5px); grid-gap:3px; cursor:pointer; }
  .waffle span { width:5px; height:5px; background:#fff; border-radius:1px; display:block; }
  .suitebar .app { font-weight:600; font-size:15px; letter-spacing:.2px; }
  .searchwrap { flex:1; max-width:560px; margin:0 auto; position:relative; }
  .searchwrap input { width:100%; height:32px; border:none; border-radius:4px; padding:0 12px 0 34px; font-size:13px; background:#fff; }
  .searchwrap::before { content:"🔍"; position:absolute; left:10px; top:6px; font-size:13px; opacity:.55; }
  .persona { display:flex; align-items:center; gap:8px; font-size:12.5px; }
  .persona select { height:30px; border-radius:4px; border:none; padding:0 8px; font-size:12.5px; background:#e9f1fa; color:#0b3d91; font-weight:600; }
  .avatar { width:30px; height:30px; border-radius:50%; background:#e8590c; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:12px; }
  /* ===== バナー ===== */
  .banner { background:#e9f1fa; border-bottom:1px solid #c9d4e4; padding:8px 20px; font-size:12.5px; color:#16337e; display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .banner b { color:#0b3d91; }
  .banner a { color:#2563eb; font-weight:600; text-decoration:none; margin-left:auto; }
  /* ===== ハブナビ（サイト＝機密レベル） ===== */
  .hubnav { background:#fff; border-bottom:1px solid #e1e4e8; display:flex; padding:0 16px; overflow-x:auto; }
  .hub-item { padding:12px 14px; cursor:pointer; white-space:nowrap; font-size:13.5px; border-bottom:3px solid transparent; color:#444; display:flex; align-items:center; gap:6px; }
  .hub-item:hover { background:#f3f6fb; }
  .hub-item.active { border-bottom-color:#0b3d91; color:#0b3d91; font-weight:700; }
  .hub-item.locked { color:#b0b6bf; cursor:not-allowed; }
  .hub-item .lv { font-size:10.5px; padding:1px 7px; border-radius:9px; font-weight:700; }
  /* レベル色 */
  .lv-L1{background:#edf2fa;color:#2f5597}.lv-L2{background:#e9f4eb;color:#217a3c}.lv-L3{background:#fff5db;color:#8a6d00}
  .lv-L4{background:#fdefe3;color:#c55a11}.lv-L5{background:#fce4e4;color:#c00000}
  .lv-HUB{background:#e6e6e6;color:#555}.lv-EX{background:#eee;color:#777}
  /* ===== レイアウト ===== */
  .wrap { display:flex; min-height:calc(100vh - 140px); }
  .side { width:280px; background:#fff; border-right:1px solid #e1e4e8; padding:14px 0; flex-shrink:0; }
  .side h3 { font-size:11.5px; color:#8a8f98; padding:4px 18px 8px; text-transform:uppercase; letter-spacing:.4px; }
  .lib { padding:9px 18px; cursor:pointer; display:flex; align-items:center; gap:8px; font-size:13px; border-left:3px solid transparent; }
  .lib:hover { background:#f3f6fb; }
  .lib.active { background:#e9f1fa; border-left-color:#0b3d91; font-weight:700; color:#0b3d91; }
  .lib .fcode { font-size:10px; color:#8a8f98; font-weight:600; min-width:30px; }
  .lib.denied { color:#b8bdc6; cursor:not-allowed; }
  .lib .cnt { margin-left:auto; font-size:11px; color:#9aa0a8; }
  .main { flex:1; padding:18px 24px; overflow-x:auto; }
  /* ライブラリヘッダ */
  .libhead { background:#fff; border:1px solid #e1e4e8; border-radius:8px; padding:14px 18px; margin-bottom:14px; }
  .libhead h2 { font-size:17px; color:#16337e; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .badges { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .badge { font-size:11px; padding:3px 9px; border-radius:10px; font-weight:600; }
  .b-sg { background:#e9f1fa; color:#16337e; }
  .b-cp-ok { background:#e9f4eb; color:#217a3c; }
  .b-cp-ng { background:#fce4e4; color:#c00000; }
  .b-meta { background:#f1f1f4; color:#555; }
  /* フィルタバー */
  .filters { display:flex; gap:10px; margin:0 0 12px; align-items:center; flex-wrap:wrap; }
  .filters select { height:30px; border:1px solid #c9d4e4; border-radius:5px; padding:0 8px; font-size:12.5px; background:#fff; color:#333; }
  .filters .hint { font-size:11.5px; color:#8a8f98; }
  .chip { background:#0b3d91; color:#fff; font-size:11.5px; padding:3px 10px; border-radius:11px; display:inline-flex; gap:6px; align-items:center; }
  .chip span{cursor:pointer;font-weight:700}
  /* テーブル */
  table { width:100%; border-collapse:collapse; background:#fff; border:1px solid #e1e4e8; border-radius:8px; overflow:hidden; }
  th { background:#f7f8fa; text-align:left; font-size:11.5px; color:#666; padding:9px 12px; border-bottom:1px solid #e1e4e8; white-space:nowrap; }
  td { padding:9px 12px; border-bottom:1px solid #eef0f2; font-size:13px; white-space:nowrap; }
  tr:hover td { background:#f6f9fd; }
  td .ico { margin-right:7px; }
  .empty { padding:36px; text-align:center; color:#8a8f98; background:#fff; border:1px dashed #c9d4e4; border-radius:8px; font-size:13px; }
  /* アクセス拒否 */
  .denybox { background:#fff; border:1px solid #e1e4e8; border-radius:8px; padding:46px 30px; text-align:center; }
  .denybox .big { font-size:42px; }
  .denybox h2 { color:#444; margin:10px 0 6px; font-size:17px; }
  .denybox p { color:#8a8f98; font-size:13px; line-height:1.7; }
  .note { margin-top:14px; font-size:11.5px; color:#8a8f98; line-height:1.7; }
  .site-desc{font-size:12.5px;color:#667085;margin-top:5px;line-height:1.6}
</style>
</head>
<body>

<!-- スイートバー -->
<div class="suitebar">
  <div class="waffle">.<span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
  <div class="app">SharePoint</div>
  <div class="searchwrap"><input id="q" type="text" placeholder="このサイトを検索（ファイル名・F分類・部署で横断検索）" oninput="render()"></div>
  <div class="persona">
    表示ユーザー:
    <select id="persona" onchange="onPersona()">
      <option value="L3">営業部・一般社員（〜L3）</option>
      <option value="L4">営業部・管理職（〜L4）</option>
      <option value="L5">役員・個別指定（〜L5）</option>
    </select>
  </div>
  <div class="avatar" id="avatar">社</div>
</div>

<!-- バナー -->
<div class="banner">
  <b>新日本ウエックス様　SharePoint移管 設計デモ</b>
  <span>設計書v2.2準拠：<b>サイト＝機密レベル階層（L1〜L5）</b>／<b>ライブラリ＝用途（F分類対応）</b>／部署・年度＝メタデータ列</span>
  <a href="dashboard.html">▶ 安全・品質ダッシュボード（Power BI風デモ）</a>
</div>

<!-- ハブナビ＝サイト -->
<div class="hubnav" id="hubnav"></div>

<div class="wrap">
  <div class="side" id="side"></div>
  <div class="main" id="main"></div>
</div>

<script>
/* =========================================================
   設計書 v2.2 の構成データ
   サイト＝機密レベル / ライブラリ＝用途(F分類) / 部署・年度＝メタデータ
========================================================= */
const SITES = [
  { id:"hub",  lv:"HUB", name:"全社ポータルハブ", need:1, desc:"全サイトの入口・共通ナビ・横断検索。ここから各レベルサイトへ移動します。" },
  { id:"l1",   lv:"L1",  name:"L1_公開情報", need:1, desc:"会社案内・採用情報など、世の中一般に出せる正本。" },
  { id:"l2",   lv:"L2",  name:"L2_全社共有（社外秘）", need:1, desc:"規程・様式・通達＋部署間共有のL2層。社内全員が閲覧できます。" },
  { id:"l3",   lv:"L3",  name:"L3_部署業務（既定）", need:1, desc:"既定の作業場所。用途ライブラリごとに主管部署のみ閲覧・編集（部外秘）。" },
  { id:"l4",   lv:"L4",  name:"L4_管理職・特定者", need:2, desc:"管理職・担当者限定。汎用Copilot・全社検索の対象外。", cpng:true },
  { id:"l5",   lv:"L5",  name:"L5_極秘（個別指定）", need:3, desc:"個別指定者のみ。対象外のユーザーには存在も見えません。", cpng:true },
  { id:"poc",  lv:"EX",  name:"検証サイト群", need:1, desc:"AI研修連動の検証用（本番と分離・消えてよい前提）。" },
  { id:"arc",  lv:"EX",  name:"アーカイブ", need:1, desc:"保存義務のみの過去文書。読み取り専用・検索/Copilot除外。" },
];

/* ライブラリ: site, F分類コード, 名称, 主管(権限グループ), Copilot, 営業部員が主管か */
const LIBS = [
  // L2 全社共有
  { site:"l2", f:"F13", name:"社内規程・様式・通達", sg:"SG-全社-閲覧（編集＝主管部署）", cp:"◎", mine:true },
  { site:"l2", f:"—",   name:"部署間共有（L2）", sg:"SG-全社-閲覧", cp:"◎", mine:true },
  // L3 用途ライブラリ（F分類対応）
  { site:"l3", f:"F01", name:"経営・ガバナンス", sg:"SG-管理本部-L3", cp:"○", mine:false },
  { site:"l3", f:"F02", name:"顧客管理・営業", sg:"SG-営業部-L3", cp:"○", mine:true },
  { site:"l3", f:"F08", name:"リネンサプライ業務", sg:"SG-業務部-L3", cp:"○", mine:false },
  { site:"l3", f:"F05/06", name:"生産・品質", sg:"SG-生産部-L3", cp:"◎", mine:false },
  { site:"l3", f:"F04", name:"調達・購買", sg:"SG-購買室-L3", cp:"○", mine:false },
  { site:"l3", f:"F14", name:"技術・研究開発", sg:"SG-技術部-L3", cp:"◎", mine:false },
  { site:"l3", f:"F10", name:"財務・会計（会計期）", sg:"SG-経理-{事業会社}", cp:"△", mine:false },
  { site:"l3", f:"F09", name:"人事・労務", sg:"SG-管理本部-L3", cp:"△", mine:false },
  { site:"l3", f:"F12/13", name:"総務・施設・環境安全", sg:"SG-管理本部-L3", cp:"○", mine:false },
  { site:"l3", f:"F11", name:"情報システム", sg:"SG-情シス-L3", cp:"△", mine:false },
  { site:"l3", f:"F07", name:"物流・配送（サービス）", sg:"SG-サービス-L3", cp:"○", mine:false },
  { site:"l3", f:"—",   name:"部署間共有（L3・主管承認）", sg:"主管部署が付与", cp:"△", mine:true },
  // L4
  { site:"l4", f:"—", name:"管理職（用途別）", sg:"SG-営業部-L4", cp:"×", mine:true },
  { site:"l4", f:"F02", name:"単価・与信・価格交渉", sg:"SG-{部署}-L4限定", cp:"×", mine:true },
  { site:"l4", f:"F05", name:"処方・基礎データ", sg:"SG-生産部-L4限定", cp:"×", mine:false },
  { site:"l4", f:"F09", name:"人事評価・健診", sg:"SG-管理本部-L4限定", cp:"×", mine:false },
  // L5
  { site:"l5", f:"F09", name:"給与・役員報酬", sg:"個別指定のみ", cp:"×", mine:true },
  { site:"l5", f:"F03", name:"訴訟・M&A", sg:"個別指定のみ", cp:"×", mine:true },
  { site:"l5", f:"F07", name:"事故映像", sg:"個別指定のみ", cp:"×", mine:true },
  // L1 / poc / arc
  { site:"l1", f:"F13", name:"公開情報（会社案内・採用）", sg:"SG-全社-閲覧", cp:"◎", mine:true },
  { site:"poc", f:"—", name:"poc-営業部（検証用）", sg:"検証メンバー", cp:"検証", mine:true },
  { site:"arc", f:"—", name:"アーカイブ（部署別）", sg:"読み取り専用", cp:"×", mine:true },
];

/* サンプルファイル: lib名, ファイル名, F, レベル, 部署, 年度 */
const FILES = [
  ["社内規程・様式・通達","📕 就業規則・規程原本.pdf","F13","L2","管理本部","2026"],
  ["社内規程・様式・通達","📄 20260401_稟議書フォーマット.docx","F13","L2","管理本部","2026"],
  ["社内規程・様式・通達","📄 内線番号一覧.xlsx","F13","L2","管理本部","2026"],
  ["部署間共有（L2）","📄 20260601_営業→生産_連携依頼シート.xlsx","F02","L2","営業部","2026"],
  ["公開情報（会社案内・採用）","📘 会社案内2026.pdf","F13","L1","管理本部","2026"],
  ["公開情報（会社案内・採用）","📘 採用情報_新卒パンフレット.pdf","F09","L1","管理本部","2026"],
  ["経営・ガバナンス","📊 2026年度_部門方針.pptx","F01","L3","管理本部","2026"],
  ["顧客管理・営業","📗 20260610_JWマリオットホテル東京_見積.xlsx","F02","L3","営業部","2026"],
  ["顧客管理・営業","📗 20260615_OMO7横浜_受注書.xlsx","F02","L3","営業部","2026"],
  ["顧客管理・営業","📄 20260620_ザセレスティン銀座_提案書.pptx","F02","L3","営業部","2026"],
  ["顧客管理・営業","📗 2025年度_京都第1営業_エリア会議資料.xlsx","F02","L3","営業部","2025"],
  ["リネンサプライ業務","📗 20260616_払出データ_加工前.xlsx","F08","L3","業務部","2026"],
  ["リネンサプライ業務","📗 20260616_払出データ_加工後.xlsx","F08","L3","業務部","2026"],
  ["生産・品質","📗 製品X_ロット2308_試験成績書.xlsx","F06","L3","技術部","2026"],
  ["生産・品質","📗 2026W25_食品UF不良率_週次.xlsx","F06","L3","生産部","2026"],
  ["生産・品質","📗 2026W25_仕上データ_福岡以外.xlsx","F05","L3","生産部","2026"],
  ["調達・購買","📗 取引先リスト_リネン資材.xlsx","F04","L3","購買室","2026"],
  ["技術・研究開発","📄 20260403_テーブル仕様書_M.docx","F14","L3","技術部","2026"],
  ["財務・会計（会計期）","📗 202606_関東エリア_月次実績.xlsx","F10","L3","経理部","2026"],
  ["人事・労務","📄 27卒_採用面接シート.docx","F09","L3","管理本部","2026"],
  ["総務・施設・環境安全","📗 SDS一覧_2026.xlsx","F12","L3","管理本部","2026"],
  ["情報システム","📄 kintone_操作手順書.pdf","F11","L3","情シス","2026"],
  ["物流・配送（サービス）","📄 添乗指導チェックポイント_追突事故防止.docx","F07","L3","サービス","2026"],
  ["部署間共有（L3・主管承認）","📗 20260618_営業⇔業務_共同編集シート.xlsx","F02","L3","営業部","2026"],
  ["管理職（用途別）","📊 2026上期_エリア会議_予算実績.pptx","F02","L4","営業部","2026"],
  ["単価・与信・価格交渉","📗 顧客別単価一覧_2026.xlsx","F02","L4","営業部","2026"],
  ["単価・与信・価格交渉","📗 与信限度額管理表.xlsx","F02","L4","営業部","2026"],
  ["処方・基礎データ","📗 処方マスタ_洗剤配合.xlsx","F05","L4","生産部","2026"],
  ["人事評価・健診","📗 健康診断用名簿.xlsx","F09","L4","管理本部","2026"],
  ["給与・役員報酬","📕 役員報酬の明細.xlsx","F09","L5","管理本部","2026"],
  ["訴訟・M&A","📕 デューデリジェンス資料.pdf","F03","L5","管理本部","2026"],
  ["事故映像","🎬 ドライブレコーダー記録_20260410.mp4","F07","L5","サービス","2026"],
  ["poc-営業部（検証用）","📄 検証用サンプル_プロンプト集.docx","—","—","DX推進","2026"],
  ["アーカイブ（部署別）","📦 2015年度_旧営業報告(読取専用).zip","F02","—","営業部","2015"],
];

const PERSONA = { L3:{need:1, av:"社"}, L4:{need:2, av:"管"}, L5:{need:3, av:"役"} };
let curSite = "l3", curLib = "顧客管理・営業";

function personaLevel(){ return PERSONA[document.getElementById("persona").value].need; }

function onPersona(){
  document.getElementById("avatar").textContent = PERSONA[document.getElementById("persona").value].av;
  const s = SITES.find(x=>x.id===curSite);
  if(s && s.need > personaLevel()){ curSite="l3"; curLib="顧客管理・営業"; }
  render();
}

function canSeeLib(l){
  // L3の部外秘：主管部署（営業部ペルソナ）以外はロック。L4/L5相当のペルソナは説明用に閲覧可とする
  if(l.site==="l3" && !l.mine && personaLevel()<2) return false;
  return true;
}

function render(){
  const lvl = personaLevel();
  /* ハブナビ */
  const hub = document.getElementById("hubnav");
  hub.innerHTML = SITES.map(s=>{
    const locked = s.need > lvl;
    if(s.id==="l5" && locked) return "";  // L5は権限が無ければ「存在も見えない」
    return `<div class="hub-item ${s.id===curSite?"active":""} ${locked?"locked":""}"
      onclick="${locked?"":`selSite('${s.id}')`}" title="${locked?"アクセス権がありません":s.desc}">
      <span class="lv lv-${s.lv}">${s.lv==="HUB"?"HUB":s.lv==="EX"?"–":s.lv}</span>${s.name}${locked?" 🔒":""}</div>`;
  }).join("");

  /* サイドバー（ライブラリ一覧） */
  const side = document.getElementById("side");
  const libs = LIBS.filter(l=>l.site===curSite);
  const site = SITES.find(s=>s.id===curSite);
  if(curSite==="hub"){
    side.innerHTML = `<h3>サイト一覧（機密レベル階層）</h3>` + SITES.filter(s=>s.id!=="hub").map(s=>{
      const locked = s.need>lvl;
      if(s.id==="l5" && locked) return "";
      return `<div class="lib ${locked?"denied":""}" onclick="${locked?"":`selSite('${s.id}')`}">
        <span class="fcode lv lv-${s.lv}">${s.lv==="EX"?"–":s.lv}</span>${s.name}${locked?" 🔒":""}</div>`;
    }).join("");
  } else {
    side.innerHTML = `<h3>${site.name} のライブラリ（用途＝F分類）</h3>` + libs.map(l=>{
      const ok = canSeeLib(l);
      const cnt = FILES.filter(f=>f[0]===l.name).length;
      return `<div class="lib ${l.name===curLib&&ok?"active":""} ${ok?"":"denied"}"
        onclick="${ok?`selLib('${l.name}')`:""}" title="${ok?l.sg:"権限なし（主管部署のみ）"}">
        <span class="fcode">${l.f}</span>${l.name}${ok?"":" 🔒"}<span class="cnt">${ok?cnt:""}</span></div>`;
    }).join("");
  }

  /* メイン */
  const main = document.getElementById("main");
  if(curSite==="hub"){
    main.innerHTML = `<div class="libhead"><h2>🏠 全社ポータルハブ</h2>
      <div class="site-desc">サイト＝機密レベル（L1公開／L2全社共有／L3部署業務＝既定／L4管理職・特定者／L5極秘）。<br>
      迷った文書は<b>L3</b>へ。「見せたくない→レベルを上げる／全社に見せたい→下げる」で振り分けます（設計書 J-19〜J-25）。<br>
      右上の<b>表示ユーザーを切り替える</b>と、権限によって見えるサイト・ライブラリが変わります（Copilotもこの権限に準拠します）。</div></div>
      <div class="note">※ 本デモはUIモックです（実データなし・サンプルファイル名は棚卸し資料に基づくダミー）。</div>`;
    return;
  }
  const lib = libs.find(l=>l.name===curLib && canSeeLib(l)) || libs.find(l=>canSeeLib(l));
  if(!lib){ main.innerHTML = `<div class="denybox"><div class="big">🔒</div><h2>アクセス権がありません</h2>
    <p>このサイトのライブラリは主管部署・特定者のみに公開されています。<br>必要な場合は「レベルを下げる」か、主管部署に共有を申請します。</p></div>`; return; }
  curLib = lib.name;

  const q = document.getElementById("q").value.trim();
  const ff = document.getElementById("f_f") ? document.getElementById("f_f").value : "";
  const fy = document.getElementById("f_y") ? document.getElementById("f_y").value : "";
  let rows = FILES.filter(f=>f[0]===lib.name);
  const all = rows.length;
  if(ff) rows = rows.filter(f=>f[2].includes(ff));
  if(fy) rows = rows.filter(f=>f[5]===fy);
  if(q) rows = rows.filter(f=>(f[1]+f[2]+f[4]).toLowerCase().includes(q.toLowerCase()));

  const cpBadge = lib.cp==="×" ? `<span class="badge b-cp-ng">Copilot・全社検索の対象外</span>`
                : `<span class="badge b-cp-ok">Copilotナレッジ ${lib.cp}（利用者の権限内のみ参照）</span>`;
  main.innerHTML = `
    <div class="libhead">
      <h2>📁 ${lib.name} <span class="lv lv-${site.lv}" style="font-size:11px;padding:2px 9px;border-radius:10px">${site.lv}</span></h2>
      <div class="badges">
        <span class="badge b-sg">権限グループ：${lib.sg}</span>
        <span class="badge b-meta">F分類：${lib.f}</span>
        ${cpBadge}
        <span class="badge b-meta">フォルダ3階層以内・部署/年度はメタデータ列</span>
      </div>
    </div>
    <div class="filters">
      <select id="f_f" onchange="render()">
        <option value="">F分類：すべて</option>
        ${[...new Set(FILES.filter(f=>f[0]===lib.name).map(f=>f[2]))].map(v=>`<option ${v===ff?"selected":""}>${v}</option>`).join("")}
      </select>
      <select id="f_y" onchange="render()">
        <option value="">年度：すべて</option>
        ${[...new Set(FILES.filter(f=>f[0]===lib.name).map(f=>f[5]))].map(v=>`<option ${v===fy?"selected":""}>${v}</option>`).join("")}
      </select>
      ${ (ff||fy||q) ? `<span class="chip">絞り込み中 ${rows.length}/${all}件 <span onclick="clearF()">✕</span></span>` : `<span class="hint">← メタデータ（F分類・年度）でフォルダを掘らずに絞り込み</span>` }
    </div>
    ${ rows.length ? `<table>
      <tr><th>名前</th><th>F分類</th><th>機密レベル</th><th>主管部署</th><th>年度</th><th>更新日</th></tr>
      ${rows.map(f=>`<tr><td>${f[1]}</td><td><b>${f[2]}</b></td>
        <td><span class="lv lv-${f[3]==="—"?"EX":f[3]}" style="font-size:10.5px;padding:1px 8px;border-radius:9px">${f[3]}</span></td>
        <td>${f[4]}</td><td>${f[5]}</td><td>2026/07/17</td></tr>`).join("")}
    </table>` : `<div class="empty">条件に一致するファイルがありません</div>` }
    <div class="note">※ 設計書v2.2準拠のUIモック（サンプルデータ）。列（F分類・機密レベル・部署・年度）が検索・絞り込み・Copilot出典確認の軸になります。</div>`;
}

function selSite(id){ curSite=id; const first=LIBS.find(l=>l.site===id && canSeeLib(l)); curLib=first?first.name:""; clearF(false); render(); }
function selLib(name){ curLib=name; clearF(false); render(); }
function clearF(doRender=true){ const a=document.getElementById("f_f"),b=document.getElementById("f_y"); if(a)a.value=""; if(b)b.value=""; document.getElementById("q").value=""; if(doRender)render(); }

render();
</script>
</body>
</html>
